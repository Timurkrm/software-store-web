<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Корзина — SoftStore</title><link rel="stylesheet" href="/css/style.css"></head><body data-page="cart"><div th:replace="~{fragments/header :: header}"></div><main class="container"><header class="page-heading"><p class="eyebrow">Корзина</p><h1>Ваши покупки</h1></header><p id="cart-state" class="state" aria-live="polite">Загрузка корзины…</p><section id="cart-content" hidden><div id="cart-items" class="cart-items"></div><div class="checkout-panel"><strong>Итого: <span id="cart-total"></span></strong><div><button id="clear-cart" class="button button-secondary" type="button">Очистить</button><button id="checkout" class="button" type="button">Оформить заказ</button></div></div></section><section id="checkout-result" class="message success" hidden></section></main><div th:replace="~{fragments/footer :: footer}"></div><div class="toast" role="status" aria-live="polite"></div><script src="/js/api.js"></script><script src="/js/app.js"></script></body></html>
