<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Вход — SoftStore</title><link rel="stylesheet" href="/css/style.css"></head><body data-page="auth"><div th:replace="~{fragments/header :: header}"></div><main class="container auth-layout"><section class="form-card"><h1>Вход</h1><form id="login-form" novalidate><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><p class="form-message" aria-live="polite"></p><button class="button" type="submit">Войти</button></form></section><section class="form-card"><h2>Регистрация</h2><form id="register-form" novalidate><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" autocomplete="new-password" minlength="6" required><small>Минимум 6 символов.</small></label><p class="form-message" aria-live="polite"></p><button class="button button-secondary" type="submit">Создать аккаунт</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div><div class="toast" role="status" aria-live="polite"></div><script src="/js/api.js"></script><script src="/js/app.js"></script></body></html>
